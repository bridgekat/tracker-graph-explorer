# Build the page and publish it to GitHub Pages.
#
# What is deployed is dist/index.html — one self-contained file, everything inlined —
# so the site is that page and nothing else. It ships with no graph in it: the page is
# for a graph.json the person opening it supplies, by dropping it on the page.
#
# One manual step, once: Settings → Pages → Source → GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What deploy-pages needs: read the tree, write a Pages deployment, and mint the
# OIDC token it uses to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy waits rather than cancelling a running one, so a half-finished
# upload never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vite 8 wants ^20.19 || >=22.12
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
