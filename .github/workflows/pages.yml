# Build the page and publish it to GitHub Pages.
#
# What is deployed is dist/index.html — one self-contained file, everything inlined —
# so the site is that page and nothing else. If a graph.json sits at the root of the
# repository it is published beside the page, and index.html?graph=graph.json then
# opens the site with that graph already loaded.
#
# One manual step, once: Settings → Pages → Source → GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What deploy-pages needs: read the tree, write a Pages deployment, and mint the
# OIDC token it uses to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy waits rather than cancelling a running one, so a half-finished
# upload never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vite 8 wants ^20.19 || >=22.12
          cache: npm

      - run: npm ci

      - run: npm run build

      # Optional: a graph committed at the root is published with the page.
      - name: Add graph.json if the repository has one
        run: |
          if [ -f graph.json ]; then
            cp graph.json dist/graph.json
            echo "published graph.json alongside the page"
          else
            echo "no graph.json at the root; the page will ask for one"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
